services:
  web:
    build: backend/
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
